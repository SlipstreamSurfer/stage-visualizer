# A guard that every commit of a pull request carries a GitHub noreply address, so no private e-mail address
# reaches the public history.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  noreply:
    if: github.event_name == 'pull_request'
    name: Commit addresses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit uses a noreply address
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Author and committer of each commit; only the commit id is printed, never the address.
          bad=$(git log --format='%H %ae %ce' "$BASE..$HEAD" | awk '{ for (i = 2; i <= 3; i++) if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com") { print $1; break } }')
          if [ -n "$bad" ]; then
            echo "These commits carry an address that is not a GitHub noreply address:"
            echo "$bad"
            echo "Rewrite them with the noreply address before merging."
            exit 1
          fi
          echo "All commits use a noreply address."

  tests:
    name: Godot 4.7.2 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/local/build-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/local/build-config
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: local/downloads
          key: godot-4.7.2-editor-${{ runner.os }}-${{ hashFiles('tools/install_export_templates.py') }}
      - name: Install verified standard editor
        run: python3 tools/install_export_templates.py --editor-only
      - name: Import and run every AGENTS.md check
        run: tools/build.sh --test-only
      - name: Keep import and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: local/builds/logs/
          if-no-files-found: ignore
