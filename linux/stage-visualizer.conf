# Stage Visualizer: an input device that carries whatever the computer is playing (the default output),
# so the visualizer's "Use system audio" button can listen to it. Remove this file to undo.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "System audio (Stage Visualizer)"
      capture.props = {
        node.name = "stage-visualizer.capture"
        stream.capture.sink = true
        node.passive = true
      }
      playback.props = {
        node.name = "stage-visualizer"
        media.class = "Audio/Source"
        audio.position = [ FL FR ]
      }
    }
  }
]
